# Server Configuration
server.port=8080

# Application Name
spring.application.name=smart-visitor-backend

# MySQL Database Configuration
# Uses Environment Variables if set, otherwise defaults to local standard values
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_visitor_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Kowsik@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Allow initial data seeding via data.sql if needed
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

